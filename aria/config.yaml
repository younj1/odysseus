guardrails:
  enabled: true
  input:
    blocked_patterns: []
    max_message_length: 0
  output:
    blocked_patterns: []
  require_confirmation:
    - "rm -rf"
    - "rm -r"
    - "format"
    - "mkfs"
    - "dd if="
    - "chmod 777"
    - "shutdown"
    - "reboot"
    - "DROP TABLE"
    - "DROP DATABASE"
    - "DELETE FROM"
    - "TRUNCATE"
  audit:
    enabled: true
    log_file: "data/aria_audit.log"
    log_inputs: true
    log_outputs: true
    log_model_used: true
    log_route_decision: true

prompts:
  directory: "aria/prompts"
  default: "general"

